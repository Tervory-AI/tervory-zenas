# Full product check (founder, 7 Nov 2026): the same scripts/check.sh the threads run,
# on GitHub's runners, once per push to a ready (non-draft) pull request. Drafts skip it.
# Dependencies come from tervory-tank at the vendored SOURCE commit, plus any locks the
# product keeps itself (researcher.lock, requirements-test.lock, tank-dev.lock).
name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Tank source at the vendored commit
        run: |
          if [ -f vendor/tervory-tank/SOURCE ]; then
            src=$(tr -d '[:space:]' < vendor/tervory-tank/SOURCE)
            git init -q "$RUNNER_TEMP/tank-src"
            git -C "$RUNNER_TEMP/tank-src" fetch -q --depth 1 https://github.com/Tervory-AI/tervory-tank.git "$src"
            git -C "$RUNNER_TEMP/tank-src" checkout -q FETCH_HEAD
            git -C "$RUNNER_TEMP/tank-src" remote add origin https://github.com/Tervory-AI/tervory-tank.git
            echo "TANK_SOURCE_REPO=$RUNNER_TEMP/tank-src" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip uv
          if [ -d "$RUNNER_TEMP/tank-src/tank" ]; then
            (cd "$RUNNER_TEMP/tank-src/tank" && pip install -r requirements.txt -r requirements-dev.txt)
          fi
          if [ -f scripts/locks/tank-dev.lock ]; then pip install -r scripts/locks/tank-dev.lock; fi
          echo "TANK_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "TIGER_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          if [ -f scripts/locks/researcher.lock ]; then
            python -m venv "$RUNNER_TEMP/researcher"
            "$RUNNER_TEMP/researcher/bin/pip" install -q --require-hashes -r scripts/locks/researcher.lock
            echo "RESEARCHER_PYTHON=$RUNNER_TEMP/researcher/bin/python" >> "$GITHUB_ENV"
          fi
          if [ -f requirements-test.lock ]; then pip install -q -r requirements-test.lock; fi
      - name: Gitleaks 8.30.1 on PATH (pinned, checksum-verified)
        run: |
          curl -fLsS --retry 2 -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "GITLEAKS=$RUNNER_TEMP/bin/gitleaks" >> "$GITHUB_ENV"
      - name: Warm the npm cache for offline template installs
        run: |
          for lock in $(git ls-files 'agents/*/templates/*/package-lock.json'); do
            dir=$(mktemp -d); cp "$(dirname "$lock")/package.json" "$lock" "$dir/"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null) || true
          done
      - name: Playwright browser (Python)
        run: python -m playwright install --with-deps chromium
      - name: Product setup script
        run: |
          if [ -f scripts/setup.sh ]; then bash scripts/setup.sh; fi
      - name: Use the runner's Chrome for browser tests
        # /usr/bin/chromium on hosted Ubuntu is a confined snap that cannot use the
        # tests' temporary profile; the preinstalled Google Chrome can.
        run: sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium && /usr/bin/chromium --version
      - name: Product check
        run: scripts/check.sh
